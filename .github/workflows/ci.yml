name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一分支有新推送时，取消还在跑的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2   # 与本地版本保持一致

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy 检查
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: 单元测试
        run: go test -race -coverprofile=coverage.out ./...
      - name: 覆盖率汇总
        run: go tool cover -func=coverage.out | tail -n 1
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # 需要 tag 信息来生成版本号
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build
      - run: ./bin/labherd-agent && ./bin/labherd-controller
