name: release

# 推送 v* tag 时发布：二进制上传到 GitHub Releases，Controller 镜像推送到 ghcr。
# 发版步骤见 docs/operations/deploy.md。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # 创建 Release
  packages: write   # 推送镜像

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"   # 静态链接，不依赖服务器上的 glibc 版本
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # 版本号由 git describe 生成
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建带前端页面的程序
        run: make release
      - name: 核对版本号与 tag 一致
        run: |
          got="$(./bin/labherd-agent -version)"
          echo "$got"
          [ "$got" = "labherd-agent ${GITHUB_REF_NAME}" ] || { echo "::error::版本号与 tag 不一致"; exit 1; }

      - name: 打包
        run: |
          mkdir -p out
          cp bin/labherd-agent out/labherd-agent-linux-amd64
          cp bin/labherd-controller out/labherd-controller-linux-amd64
          cd out && sha256sum * > sha256sums.txt && cat sha256sums.txt

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --verify-tag --generate-notes $flags

      - name: 生成镜像标签
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/labherd-controller"
          {
            echo "list<<EOF"
            echo "${image}:${GITHUB_REF_NAME}"
            # 预发布版本（如 v0.2.0-rc.1）不更新 latest
            case "$GITHUB_REF_NAME" in *-*) ;; *) echo "${image}:latest" ;; esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 推送 Controller 镜像
        uses: docker/build-push-action@v6
        with:
          context: out       # 只把打包好的二进制作为构建上下文
          file: build/controller.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
