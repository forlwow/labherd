name: Bug
description: 已有功能出错
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 实际发生了什么，附日志或截图。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 包括版本号（labherd-agent --version）、哪台服务器。
    validations:
      required: true
