# 复制为 inventory.ini 后填写实际服务器（inventory.ini 不提交）。
# 每行一台 GPU 服务器；ansible_user 是 SSH 登录账号，需要有 sudo 权限。

[gpu_nodes]
10.0.0.11 ansible_user=lab
10.0.0.12 ansible_user=lab
# 个别主机需要额外参数时按主机覆盖：
10.0.0.13 ansible_user=lab labherd_agent_args="-advertise-ip=10.0.0.13 -exclude-mounts=/mnt/scratch"

[gpu_nodes:vars]
labherd_controller_addr=10.0.0.10:9090
