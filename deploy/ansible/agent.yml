# 在 inventory 中的 GPU 服务器上安装或升级 labherd-agent。
#
#   cd deploy/ansible
#   ansible-playbook agent.yml -e labherd_version=v0.1.0
#
# 下载会使用环境变量 https_proxy；控制机访问不了 GitHub 时，
# 可设置 labherd_release_base 指向镜像，或用 labherd_agent_binary 指定本地文件。
#
# 发布包只在控制机（运行 ansible 的机器）上下载一次，再经 SSH 复制到各服务器，
# 服务器本身不需要访问 GitHub。用法与变量说明见 docs/operations/deploy.md。
- name: 部署 labherd-agent
  hosts: gpu_nodes
  become: true
  # 可配置变量（labherd_version、labherd_controller_addr、labherd_agent_args、
  # labherd_agent_binary）不在这里定义默认值：play 的 vars 优先级高于 inventory，
  # 在这里写默认值会覆盖 inventory 中的设置。下面只定义由它们派生的内部变量。
  vars:
    agent_version: "{{ labherd_version | default('') }}"
    agent_controller_addr: "{{ labherd_controller_addr | default('') }}"
    agent_args: "{{ labherd_agent_args | default('') }}"
    agent_local_binary: "{{ labherd_agent_binary | default('') }}"
    agent_release_base: "{{ labherd_release_base | default('https://github.com/forlwow/labherd/releases/download') }}"
    agent_asset: labherd-agent-linux-amd64
    agent_cache_dir: "{{ lookup('env', 'HOME') }}/.cache/labherd/{{ agent_version }}"

  pre_tasks:
    - name: 检查必填变量
      ansible.builtin.assert:
        that:
          - agent_controller_addr | length > 0
          - agent_version | length > 0 or agent_local_binary | length > 0
        fail_msg: 需要设置 labherd_controller_addr，以及 labherd_version 或 labherd_agent_binary
      run_once: true

    - name: 在控制机创建下载目录
      ansible.builtin.file:
        path: "{{ agent_cache_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true
      when: agent_local_binary | length == 0

    - name: 在控制机下载发布包并校验 sha256
      ansible.builtin.get_url:
        url: "{{ agent_release_base }}/{{ agent_version }}/{{ agent_asset }}"
        dest: "{{ agent_cache_dir }}/{{ agent_asset }}"
        checksum: "sha256:{{ agent_release_base }}/{{ agent_version }}/sha256sums.txt"
        mode: "0755"
        timeout: 120          # 校园网访问 GitHub 较慢，默认 10 秒不够
      register: agent_download
      retries: 3
      delay: 5
      until: agent_download is succeeded
      delegate_to: localhost
      become: false
      run_once: true
      when: agent_local_binary | length == 0

  tasks:
    - name: 创建 labherd 系统用户
      ansible.builtin.user:
        name: labherd
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: 安装 Agent 二进制
      ansible.builtin.copy:
        src: "{{ agent_local_binary if agent_local_binary | length > 0 else agent_cache_dir ~ '/' ~ agent_asset }}"
        dest: /usr/local/bin/labherd-agent
        owner: root
        group: root
        mode: "0755"
      notify: 重启 labherd-agent

    - name: 创建配置目录
      ansible.builtin.file:
        path: /etc/labherd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: 写入 Agent 配置
      ansible.builtin.template:
        src: agent.env.j2
        dest: /etc/labherd/agent.env
        owner: root
        group: root
        mode: "0644"
      notify: 重启 labherd-agent

    - name: 安装 systemd unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/labherd-agent.service"
        dest: /etc/systemd/system/labherd-agent.service
        owner: root
        group: root
        mode: "0644"
      notify: 重启 labherd-agent

    - name: 启用并启动 labherd-agent
      ansible.builtin.systemd_service:
        name: labherd-agent
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: 重启 labherd-agent
      ansible.builtin.systemd_service:
        name: labherd-agent
        state: restarted
        daemon_reload: true

  post_tasks:
    - name: 确认 Agent 正在运行
      ansible.builtin.command: systemctl is-active labherd-agent
      register: labherd_agent_state
      changed_when: false
      retries: 3
      delay: 3
      until: labherd_agent_state.stdout == "active"
